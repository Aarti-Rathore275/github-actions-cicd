name: Node.js CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Docker Image
        run: docker build -t github-actions-cicd .

      - name: Run Docker Container
        run: |
          docker run -d -p 3000:3000 --name cicd-test github-actions-cicd
          sleep 5

      - name: Test Application
        run: curl -f http://localhost:3000

      - name: Stop Docker Container
        if: always()
        run: docker stop cicd-test || true
